version: "3.9"

services:
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - APP_VERSION=1.0.0
      - ALLOWED_ORIGINS=http://localhost:3000
      - URL_DOWNLOAD_TIMEOUT=15
      - SCORE_THRESHOLD=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
